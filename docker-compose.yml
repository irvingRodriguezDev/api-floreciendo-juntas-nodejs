version: "3.9"

services:
  mariadb:
    image: mariadb:jammy
    container_name: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: password
      MARIADB_DATABASE: myapp_db
      MARIADB_USER: myapp_user
      MARIADB_PASSWORD: myapp_pass_456
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - app_network

  node-api:
    build: .
    container_name: node-api
    restart: always
    depends_on:
      - mariadb
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - app_network

networks:
  app_network:

volumes:
  mariadb_data:
