<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boleto Premium</title>
    <style>
        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .ticket {
            width: 400px;
            border-radius: 20px;
            background: white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ec4899, #f472b6);
            color: white;
            text-align: center;
            padding: 12px;
            font-weight: bold;
            font-size: 18px;
            position: relative;
        }

        .header::after {
            content: "";
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
        }

        .content {
            text-align: center;
            padding: 40px 20px 20px 20px;
        }

        .qr {
            margin: 10px auto;
            width: 140px;
            height: 140px;
        }

        .details {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }

        .details div {
            text-align: center;
        }

        .footer {
            border-top: 1px dashed #d1d5db;
            margin: 15px 20px 0 20px;
            padding: 10px 0;
            text-align: center;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <div class="ticket">
        <div class="header">🎟️ Boarding Pass</div>

        <div class="content">
            <img class="qr" src="{{QR_CODE}}" alt="QR Code" />

            <div class="details">
                <div>
                    <h2>{{EVENT_SHORT}}</h2>
                    <p>{{EVENT_CITY}}</p>
                </div>
                <div>
                    <h2>{{EVENT_DEST}}</h2>
                    <p>{{EVENT_COUNTRY}}</p>
                </div>
            </div>

            <div style="margin-top: 15px;">
                <p><strong>Comprador:</strong> {{BUYER_NAME}}</p>
                <p><strong>Fecha:</strong> {{EVENT_DATE}}</p>
                <p><strong>Hora:</strong> {{EVENT_TIME}}</p>
            </div>
        </div>

        <div class="footer">
            <p>{{EVENT_TITLE}}</p>
            <p>Presenta este boleto al ingresar</p>
        </div>
    </div>
</body>

</html>
